# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: CI/CD

# Tiers
#   fast  every PR push: debug-worker tests plus a reduced set of real-worker (cf) tests on
#         one Linux and one macOS job; no wall-clock tests, no slurm/docker/singularity/lmod,
#         no docs; Python 3.13 only, on Linux, macOS and Windows
#   full  PRs that are marked ready for review or carry the `release` label, merge queue
#         runs (merge_group), pushes to main, releases, manual runs and the weekly schedule:
#         the whole OS x Python 3.11-3.15 matrix with every test, plus singularity, lmod,
#         slurm and docs
# The weekly schedule (main only) re-runs the full tier so the uv, Singularity and Slurm
# image caches are refreshed before GitHub evicts them after 7 days, and publishes the
# Slurm image to ghcr.io when its tag is missing (see `slurm-image`).
# The `CI gate` job is the one check branch protection should require: it fails unless the
# full tier passed on a non-draft PR, so nothing reaches main without the full suite.
on:
  release:
    types: [published]
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC, default branch only

# Only PR runs cancel each other. Releases, pushes to main, merge-queue, scheduled and manual runs
# each have their own group and are never cancelled, so nothing can cancel the deploy. A label
# event other than `release` gets a unique group so it cannot cancel the run in progress.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{
    (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'release' && github.run_id || 'ci' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Force tox and pytest to use color
  FORCE_COLOR: true

jobs:
  plan:
    name: Select test tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.tier.outputs.run }}
      full: ${{ steps.tier.outputs.full }}
      matrix: ${{ steps.tier.outputs.matrix }}
    steps:
      - name: Select tier and test matrix
        id: tier
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          run=true
          full=true
          if [ "$EVENT" = pull_request ]; then
            full=false
            if jq -e 'index("release")' <<<"$LABELS" >/dev/null || [ "$ACTION" = ready_for_review ]; then
              full=true
            fi
            # a label other than `release` changes nothing: skip the whole run
            case "$ACTION" in labeled|unlabeled) [ "$LABEL" = release ] || run=false ;; esac
          fi
          if [ "$full" = true ]; then
            # latest dependencies on every OS x Python; pre-release dependencies on the default
            # (3.13) and newest (3.15) Python on Linux; minimum dependencies on the oldest Python
            matrix=$(jq -nc '{include:(
              [("ubuntu-latest","macos-latest","windows-latest") as $os | ("3.11","3.12","3.13","3.14","3.15") as $py
                | {os:$os,"python-version":$py,dependencies:"latest"}]
              + [("3.13","3.15") as $py | {os:"ubuntu-latest","python-version":$py,dependencies:"pre"}]
              + [{os:"ubuntu-latest","python-version":"3.11",dependencies:"min"}])}')
          else
            fast='not slow and not slurm and not docker and not singularity and not lmod'
            matrix=$(jq -nc --arg f "$fast" --arg r "$fast and not real_worker" '{include:[
              {os:"ubuntu-latest","python-version":"3.13",dependencies:"latest",markers:$f,real:true},
              {os:"macos-latest","python-version":"3.13",dependencies:"latest",markers:$f,real:true},
              {os:"windows-latest","python-version":"3.13",dependencies:"latest",markers:$r}]}')
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build & verify package
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2
        with:
          attest-build-provenance-github: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.event_name != 'schedule' }}

  test:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ (needs.plan.outputs.full == 'true' || matrix.real) && 25 || 10 }}
    strategy:
      # Full tier: every OS x Python 3.11-3.15, plus pre-release and minimum dependency
      # variants. Fast tier: Python 3.13 only (see the plan job).
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
      fail-fast: false

    env:
      DEPENDS: ${{ matrix.dependencies }}
      # Fast tier: marker expression from the plan job (cf tests only on the `real` jobs)
      PYTEST_ADDOPTS: ${{ matrix.markers && format('-m "{0}"', matrix.markers) || '' }}

    steps:
      - name: Fetch repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ matrix.dependencies }}
      - name: Install tox
        run: |
          uv tool install tox --with=tox-uv --with=tox-gh-actions
      - name: Show tox config
        run: tox c
      - name: Run tox
        run: tox -v --exit-and-dump-after ${{ (needs.plan.outputs.full == 'true' || matrix.real) && 900 || 300 }}

  test-singularity:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        dependencies: [latest]
      fail-fast: False

    env:
      DEPENDS: ${{ matrix.dependencies }}
      SINGULARITY_PREFIX: ${{ github.workspace }}/../singularity-install

    steps:
      - name: Set env
        run: |
          echo "RELEASE_VERSION=v3.7.1" >> $GITHUB_ENV
          echo "NO_ET=TRUE" >> $GITHUB_ENV
      - name: Restore built Singularity
        id: singularity-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SINGULARITY_PREFIX }}
          key: singularity-v3.7.1-ubuntu-22.04
      - name: Setup Singularity
        if: steps.singularity-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: hpcng/singularity
          ref: 'v3.7.1'
          path: 'singularity'
      - name: Setup GO
        if: steps.singularity-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '^1.13'
      - name: Install OS deps
        run: |
          sudo apt-get update
          sudo apt-get install flawfinder squashfs-tools uuid-dev libuuid1 libffi-dev libssl-dev libssl1.1 \
          libarchive-dev libgpgme11-dev libseccomp-dev wget gcc make pkg-config -y
      - name: Build
        if: steps.singularity-cache.outputs.cache-hit != 'true'
        run: |
          cd singularity
          ./mconfig --without-suid -p "$SINGULARITY_PREFIX"
          make -C ./builddir
          make -C ./builddir install
          cd ..
      - name: Echo singularity version
        run: |
          echo "$SINGULARITY_PREFIX/bin" >> "$GITHUB_PATH"
          echo ${{ github.ref }}
          "$SINGULARITY_PREFIX/bin/singularity" --version
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install tox
        run: |
          uv tool install tox --with=tox-uv --with=tox-gh-actions
      - name: Show tox config
        run: tox c
      - name: Run tox
        # Run test files with singularity tests; re-add the overridable "-n auto"
        run: |
          tox -v --exit-and-dump-after 900 -- -n auto \
            pydra/environments/tests/test_singularity.py pydra/environments/tests/test_environments.py

  test-lmod:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        dependencies: [latest]
      fail-fast: False

    env:
      DEPENDS: ${{ matrix.dependencies }}

    steps:
      - name: Install Lmod
        run: sudo apt-get install -y lmod
      - name: Set env
        run: |
          echo "RELEASE_VERSION=v3.7.1" >> $GITHUB_ENV
          echo "NO_ET=TRUE" >> $GITHUB_ENV
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install tox
        run: |
          uv tool install tox --with=tox-uv --with=tox-gh-actions
      - name: Show tox config
        run: tox c
      - name: Run tox
        # Run test files with singularity tests; re-add the overridable "-n auto"
        run: |
          source /etc/profile.d/lmod.sh
          export
          tox -v --exit-and-dump-after 900 -- -n auto \
            pydra/environments/tests/test_lmod.py


  # Publishes the Slurm image as ghcr.io/nipype/pydra-slurm:<hash of .github/slurm/**> so every
  # PR can pull it (Actions caches are not shared between PRs). Trusted events on main only;
  # this is the only job with `packages: write`, and PRs (forks included) never reach it.
  slurm-image:
    needs: plan
    if: >-
      needs.plan.outputs.full == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nipype/pydra-slurm
    steps:
    - uses: actions/checkout@v7
    - name: Check whether the tag exists
      id: exists
      run: |
        tag="${{ hashFiles('.github/slurm/**') }}"
        if docker manifest inspect "$IMAGE:$tag" > /dev/null 2>&1; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        fi
    - uses: docker/setup-buildx-action@v3
      if: steps.exists.outputs.present != 'true'
    - uses: docker/login-action@v3
      if: steps.exists.outputs.present != 'true'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push the Slurm image
      if: steps.exists.outputs.present != 'true'
      uses: docker/build-push-action@v6
      with:
        context: .github/slurm
        push: true
        tags: ${{ env.IMAGE }}:${{ hashFiles('.github/slurm/**') }}
        cache-from: type=gha,scope=slurm-${{ hashFiles('.github/slurm/**') }}
        cache-to: type=gha,mode=max,scope=slurm-${{ hashFiles('.github/slurm/**') }}

  test-slurm:
    needs: [plan, slurm-image]
    # slurm-image is skipped on PRs; its failure only means the job builds the image itself
    if: ${{ !cancelled() && needs.plan.outputs.full == 'true' }}
    strategy:
      # Full tier only (the fast tier excludes the slurm marker): the same Python range as `test`
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UV_CACHE_HOST: ${{ github.workspace }}/../uv-cache-slurm
    steps:
    - name: Disable etelemetry
      run: echo "NO_ET=TRUE" >> $GITHUB_ENV
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install uv (copied into the container)
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: false
    - name: Pull the published Slurm image (anonymous, read-only)
      id: pull
      run: |
        if docker pull "ghcr.io/nipype/pydra-slurm:${{ hashFiles('.github/slurm/**') }}"; then
          docker tag "ghcr.io/nipype/pydra-slurm:${{ hashFiles('.github/slurm/**') }}" pydra-slurm:ci
          echo "hit=true" >> "$GITHUB_OUTPUT"
        fi
    - uses: docker/setup-buildx-action@v3
      if: steps.pull.outputs.hit != 'true'
    - name: Build the Slurm image (layer cache keyed on the Dockerfile, which pins the base by digest)
      if: steps.pull.outputs.hit != 'true'
      uses: docker/build-push-action@v6
      with:
        context: .github/slurm
        load: true
        tags: pydra-slurm:ci
        cache-from: type=gha,scope=slurm-${{ hashFiles('.github/slurm/**') }}
        cache-to: type=gha,mode=max,scope=slurm-${{ hashFiles('.github/slurm/**') }}
    - name: Restore the container's uv cache
      uses: actions/cache@v4
      with:
        path: ${{ env.UV_CACHE_HOST }}
        key: slurm-uv-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          slurm-uv-
    - name: Start the container and wait for the daemons
      run: |
        mkdir -p "$UV_CACHE_HOST"
        docker run -d -h slurmctl --name slurm -v "$(pwd)":/pydra -v "$UV_CACHE_HOST":/root/.cache/uv -e NO_ET=$NO_ET pydra-slurm:ci
        for i in $(seq 1 120); do
          if docker exec slurm bash -c "sinfo -h | grep -qE 'idle|mix' && sacctmgr -n show cluster | grep -q linux" > /dev/null 2>&1; then
            docker exec slurm bash -c "sinfo && sbatch --version && sacct -X"
            exit 0
          fi
          sleep 1
        done
        echo "Slurm daemons did not become ready"
        docker logs slurm
        exit 1
    - name: Setup Python
      run: |
        # uv installs a prebuilt CPython in about a second
        docker cp "$(command -v uv)" slurm:/usr/local/bin/uv
        docker exec slurm bash -c "uv venv --python ${{ matrix.python-version }} /opt/venv"
        docker exec slurm bash -c "uv pip install --python /opt/venv/bin/python -e /pydra[test,psij] && /opt/venv/bin/python -c 'import pydra.engine; print(pydra.utils.__version__)'"
    - name: Run pytest
      run: |
        docker exec slurm bash -c "cd /pydra; /opt/venv/bin/pytest pydra/workers/tests/test_worker.py --only-worker=slurm --color=yes"
    - name: Return ownership of the uv cache to the runner
      if: always()
      run: docker exec slurm bash -c "chown -R $(id -u):$(id -g) /root/.cache/uv"

  # The single check branch protection should require (see the PR description). It fails when
  # the tier that should have run did not pass, and, on a non-draft PR, when the full tier was
  # not what ran for this commit.
  gate:
    name: CI gate
    needs: [plan, build, test, test-singularity, test-lmod, test-slurm, build-docs]
    if: always() && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          FULL: ${{ needs.plan.outputs.full }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          ALWAYS: ${{ needs.plan.result }} ${{ needs.build.result }} ${{ needs.test.result }}
          FULL_ONLY: ${{ needs.test-singularity.result }} ${{ needs.test-lmod.result }} ${{ needs.test-slurm.result }} ${{ needs.build-docs.result }}
        run: |
          for r in $ALWAYS; do
            [ "$r" = success ] || { echo "a required job finished with: $r"; exit 1; }
          done
          for r in $FULL_ONLY; do
            if [ "$FULL" = true ]; then
              [ "$r" = success ] || { echo "a full-tier job finished with: $r"; exit 1; }
            fi
          done
          if [ "$EVENT" = pull_request ] && [ "$FULL" != true ] && [ "$DRAFT" != true ]; then
            echo "Only the fast tier ran for this commit. Add the 'release' label to run the full tier."
            exit 1
          fi

