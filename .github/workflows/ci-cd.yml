  build-docs:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Set up the environment so that it finds conda
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - name: Install Pandoc for NBSphinx and graphviz for workflow plotting (dot)
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc graphviz mrtrix3
    - name: Install Dependencies for virtual notifications in Adv.-Exec Tutorial
      run: |
          sudo apt update
          sudo apt install -y xvfb libnotify-bin dbus-x11 xfce4-notifyd
    - name: Start Virtual Display (for notifications)
      run: |
        Xvfb :99 &
        export DISPLAY=:99
        eval "$(dbus-launch --sh-syntax)"
        echo "DISPLAY=:99" >> $GITHUB_ENV
        echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV
    - name: Start Notification Daemon (for notifications)
      run: |
        xfce4-notifyd &
        sleep 2  # Give it some time to start
    - name: Send Notification (test notifications)
      run: |
        notify-send "GitHub Runner Notification" "This is a test notification from GitHub Actions"
    - name: Debug Running Processes (for notifications)
      run: |
        ps aux | grep notify
        ps aux | grep xfce4-notifyd
        dbus-monitor --session &
        sleep 3
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install package
      run: pip install .[doc]
    - name: Install Python3 kernel
      run: python -m ipykernel install --user
    - name: Build docs
      run: make -C docs html
    - uses: actions/upload-artifact@v7
      with:
        name: docs
        path: docs/build/html

  deploy:
    needs: [build, build-docs, test, test-singularity, test-slurm, test-lmod]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      attestations: write
      id-token: write
    steps:
    - name: Download dist
      uses: actions/download-artifact@v8
      with:
        name: Packages
        path: dist
    - name: Upload to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  deploy-docs:
    needs: [build-docs, deploy]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
    - name: Download docs
      uses: actions/download-artifact@v8
      with:
        name: docs
        path: docs-build
    - name: Deploy Docs to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        deploy_key: ${{ secrets.GHPAGES_DEPLOY_KEY }}
        publish_dir: docs-build
